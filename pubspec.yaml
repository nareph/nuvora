name: gymgenius
description: "Nuvora — Personal Health Intelligence"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Local Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  
  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.5
  bloc: ^9.0.0
  
  # Utilities
  equatable: ^2.0.5
  uuid: ^4.5.1
  intl: ^0.20.2
  logger: ^2.5.0
  shared_preferences: ^2.5.3
  
  # Authentication (Local)
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  
  # UI Components
  page_indicator: ^0.4.1
  table_calendar: ^3.2.0
  audioplayers: ^6.4.0
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.4
  formz: ^0.8.0
  dio: ^5.9.1
  wakelock_plus: ^1.4.0
  get_it: ^9.2.1
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/launcher_icon/
    - assets/exercises/exercises.json
    - assets/exercises/exercise_taxonomy.json
    - assets/exercises/images/
    - assets/exercises/videos/  

flutter_launcher_icons:
  android: true
  ios: true

  # Master PNG exported from the Nuvora SVG.
  image_path: "assets/launcher_icon/launcher_icon.png"

  min_sdk_android: 21
  remove_alpha_ios: true

  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/launcher_icon/launcher_icon.png"
